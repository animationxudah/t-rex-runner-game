<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f172a" />
    <title>Dino Legends Runner</title>
    <link rel="stylesheet" href="trex.css" />
    <link rel="stylesheet" href="custom.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hud card">
        <div>
          <h1>Dino Legends</h1>
          <p class="sub">Tap / Space to jump • Reach 40,000,000 for true ending</p>
        </div>
        <div class="stats">
          <span>Score: <strong id="score">0</strong></span>
          <span>Best: <strong id="best">0</strong></span>
          <span>Flight: <strong id="flight-status">Locked</strong></span>
        </div>
      </section>

      <section class="card arena">
        <div class="trex-game" id="trex-game"></div>
        <p id="ending-banner" class="ending-banner hidden">💞 Ending Unlocked: 2 Dino Pacaran Forever 💞</p>
      </section>

      <section class="card locker">
        <div class="locker-head">
          <h2>Skin Collection (12)</h2>
          <span id="unlock-note">Start from score 1000+</span>
        </div>
        <div id="skin-grid" class="skin-grid"></div>
      </section>
      <footer class="creator">Creator: <span>name</span></footer>
    </main>

    <div id="offline-resources" style="display: none">
      <img id="offline-resources-1x" src="images/default_100_percent/100-offline-sprite.png" />
      <img id="offline-resources-2x" src="images/default_200_percent/200-offline-sprite.png" />
      <template id="audio-resources"></template>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
